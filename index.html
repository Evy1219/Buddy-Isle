<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buddy Isle</title>
  <meta name="description" content="A little block island in your browser, built by an AI best friend who keeps building while you're away.">
  <meta name="theme-color" content="#0f3047">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./src/vendor/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="The island"></canvas>
  <div id="ui"></div>
  <noscript><p class="noscript">Buddy Isle needs JavaScript turned on.</p></noscript>
  <script type="module" src="src/main.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      if (window.__shownError || window.game) return; window.__shownError = true;
      var d = document.createElement('div'); d.className = 'fatal';
      d.textContent = 'Something went wrong: ' + (e.message || e) + '. Try reloading. If it keeps happening, your browser may not support WebGL.';
      document.body.appendChild(d);
    });
  </script>
</body>
</html>
